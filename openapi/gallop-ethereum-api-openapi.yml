  /insights/eth/getTokenAppraisal:
    post:
      security:
      - api_key: []
      summary: Liquidation & Appraisal Estimate by Token
      description: Get estimates of appraisal and liquidation values for a set of tokens. The app returns nowcasts by default, but if provided a `horizon` and `frequency`, it will return forcasts for `horizon` periods out at interval `frequency`. The app is does not deliver individualized financial advice, but merely provides analytical estimates of token appraisal and liquidation values
      operationId: getEthTokenAppraisal
      tags:
      - Ethereum
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                collection_address:
                  type: string
                  description: The contract address of the token collection.
                  example: '0xbc4ca0eda7647a8ab7c2061c2e118a18a936f13d'
                token_id:
                  type: array
                  description: The id(s) for the token(s).
                  items:
                    type: string
                    example: '40'
                rept_curr:
                  type: string
                  enum:
                  - eth
                  - usd
                  description: The currency to report results in
                  example: eth
                frequency:
                  type: string
                  description: The interval at which to calculate intermediate results and forecasts.
                  example: 1W
                horizon:
                  type: integer
                  description: The forecast horizon (i.e. the number of periods to forecast out). Defaults to zero which only returns nowcasts.
                  example: 5
                alpha:
                  type: number
                  description: The significance level for the liquidation estimate, e.g. 0.05 for 95% confidence
                  example: 0.1
                exclude_wash:
                  type: boolean
                  description: Exclude suspected wash transactions?
                  example: 'true'
              required:
              - collection_address
              - token_id
      responses:
        '200':
          description: An object containing appraisal and liquidation value estimates for a (set of) given token id(s).
          content:
            application/json:
              example:
                status: 200
                response:
                - token_id: '40'
                  appraisal: 78.03807216506911
                  liquidation: 65.57171592775042
                  forecasts: null
        '400':
          description: Bad request
        '403':
          description: Unauthorized
  /insights/eth/getWalletLabels:
    post:
      security:
      - api_key: []
      summary: Wallet Activity Labels
      description: "Classifies a wallet's behaviour according to its on-chain activity.          Each wallet has labels for volume (ETH value transacted), activity (number of unique transactions), and wash (proportion of trades suspected to be washes). \n         Labels for volume_status include: zero (no transactions), light (less than ~0.75 ETH transacted), neutral (less than ~100 ETH transacted), high (over ~100 ETH transacted) \n         Labels for activity_status include: zero (no transactions), dormant (fewer than ~12 transactions), neutral (fewer than ~200 transactions), active (over ~200 transactions) \n         Labels for wash_status include: none (no suspected washes), low (fewer 5% of transactions are suspected washes), moderate (fewer 50% of transactions are suspected washes), high (over 50% of transactions are suspected washes) \n         Note: label weights are based on constant quantiles so exact thresholds are subject to change."
      operationId: getEthWalletLabels
      tags:
      - Ethereum
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                wallet_address:
                  type: array
                  description: The EVM compatible wallet addresses
                  items:
                    type: string
                    example: '0xcf561ea02950b819b0999ab3c3b43243d53e9b51'
              required:
              - wallet_address
      responses:
        '200':
          description: An object containing the wallet labels
          content:
            application/json:
              example:
                status: 200
                response:
                - blockchain: eth
                  wallet_address: '0x73b03def245f5c8ab4f58a40df4ae28ace64b1c4'
                  volume_status: heavy
                  activity_status: active
                  wash_status: low
        '400':
          description: Bad request
        '403':
          description: Unauthorized
