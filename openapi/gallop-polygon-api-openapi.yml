  /analytics/pol/getRarity:
    post:
      security:
      - api_key: []
      summary: Token Rarity by Collection
      description: Returns rarity by token for a given collection
      operationId: getPolRarity
      tags:
      - Polygon
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                collection_address:
                  type: string
                  description: The Polygon contract address to identify the collection.
                  example: '0xfbe3ab0cbfbd17d06bdd73aa3f55aaf038720f59'
                weights:
                  type: object
                  description: Dict containing trait keys and weight values.
                  properties: {}
                  example:
                    Clothes: 0.1
                    Ears: 0.1
                    Eyes: 1
                    Head: 0.1
                    Mouth: 0.1
                    Rarity: 0.1
                    Trait Count: 0.1
                token_id:
                  type: array
                  description: An array of token ids.
                  items:
                    type: string
                    example: '1327'
              required:
              - collection_address
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                status: 200
                response:
                - token_id: '1357'
                  token_name: 'Cool Monke #1357'
                  rarity_score: 0.0831
                  trait_rarity_score:
                    Ears: 0.0008
                    Eyes: 0.0221
                    Head: 0.0015
                    Mouth: 0.0221
                    Rarity: 0.0029
                    Clothes: 0.033
                    Overall: 0.0831
                    Trait Count: 0.0007
                - token_id: '3333'
                  token_name: 'Cool Monke #3333'
                  rarity_score: 0.1984
                  trait_rarity_score:
                    Ears: 0.0008
                    Eyes: 0.0221
                    Head: 0.0015
                    Mouth: 0.0387
