                  description: The pagination cursor.
                  example: 1
                page_size:
                  type: integer
                  enum:
                  - 50
                  - 100
                  - 500
                  - 1000
                  description: The number of records returned per page.
                  example: 100
                interval:
                  type: string
                  enum:
                  - one_day
                  - seven_days
                  - thirty_days
                  - ninety_days
                  - all_time
                  description: The requested time interval
                  example: one_day
                ranking_metric:
                  type: string
                  enum:
                  - eth_volume
                  - sales_count
