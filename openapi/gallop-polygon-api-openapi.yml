  /insights/pol/getTokenAppraisal:
    post:
      security:
      - api_key: []
      summary: Liquidation & Appraisal Estimate by Token
      description: Get estimates of appraisal and liquidation values for a set of tokens. The app returns nowcasts by default, but if provided a `horizon` and `frequency`, it will return forcasts for `horizon` periods out at interval `frequency`. The app is does not deliver individualized financial advice, but merely provides analytical estimates of token appraisal and liquidation values
      operationId: getPolTokenAppraisal
      tags:
      - Polygon
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                collection_address:
                  type: string
                  description: The contract address of the token collection.
                  example: '0xad59ecb77033391e847cc96829b08beb83151088'
                token_id:
                  type: array
                  description: The id(s) for the token(s).
                  items:
                    type: string
                    example: '5715'
                rept_curr:
                  type: string
                  enum:
                  - eth
                  - usd
                  - matic
                  description: The currency to report results in
                  example: eth
                frequency:
                  type: string
                  description: The interval at which to calculate intermediate results and forecasts.
                  example: 1W
                horizon:
                  type: integer
                  description: The forecast horizon (i.e. the number of periods to forecast out). Defaults to zero which only returns nowcasts.
                  example: 5
                alpha:
                  type: number
                  description: The significance level for the liquidation estimate, e.g. 0.05 for 95% confidence
                  example: 0.1
                exclude_wash:
                  type: boolean
                  description: Exclude suspected wash transactions?
                  example: 'true'
              required:
              - collection_address
              - token_id
      responses:
        '200':
          description: An object containing appraisal and liquidation value estimates for a (set of) given token id(s).
          content:
            application/json:
              example:
                status: 200
                response:
                - appraisal: 0.086
                  forecasts:
                    appraisal:
                      '2022-11-16 00:00:00': 0.08567277189118791
                      '2022-11-16 12:00:00': 0.0854334216627671
                      '2022-11-17 00:00:00': 0.08717138963930088
                    liquidation:
                      '2022-11-16 00:00:00': 0.08567277189118791
                      '2022-11-16 12:00:00': 0.0854334216627671
                      '2022-11-17 00:00:00': 0.08717138963930088
                  liquidation: 0.086
                  token_id: '5715'
        '400':
          description: Bad request
        '403':
          description: Unauthorized
  /insights/pol/getWalletLabels:
    post:
      security:
      - api_key: []
      summary: Wallet Activity Labels
      description: Classifies a wallet's behaviour according to its on-chain activity
      operationId: getPolWalletLabels
      tags:
      - Polygon
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                wallet_address:
                  type: array
                  description: The EVM compatible wallet addresses
                  items:
                    type: string
                    example: '0xcf561ea02950b819b0999ab3c3b43243d53e9b51'
              required:
              - wallet_address
      responses:
        '200':
          description: An object containing the wallet labels
          content:
            application/json:
              example:
                status: 200
                response:
                - blockchain: pol
                  wallet_address: '0xfdff2b0be5caf0d62c89ba460e607b58263f3ca0'
                  volume_status: heavy
                  activity_status: active
                  wash_status: low
        '400':
          description: Bad request
        '403':
          description: Unauthorized
